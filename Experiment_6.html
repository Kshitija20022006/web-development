<!DOCTYPE html>
<html>
<head>
    <title>HTML Links Example</title>
</head>
<body>

<h1>HTML Link Tags</h1>

<!-- External Link -->
<p><a href="https://www.google.com">Visit Google</a></p>

<!-- Open link in new tab -->
<p><a href="https://www.wikipedia.org" target="_blank">Open Wikipedia in New Tab</a></p>

<!-- Email Link -->
<p><a href="mailto:example@gmail.com">Send Email</a></p>

<!-- Phone Link -->
<p><a href="tel:+919876543210">Call Us</a></p>

<!-- Internal Page Link -->
<p><a href="#section1">Go to Section 1</a></p>

<br><br><br><br><br>

<h2 id="section1">Section 1</h2>
<p>This is internal linking within the same page.</p>

<!-- Image as Link -->
<a href="https://www.youtube.com">
    <img src="https://via.placeholder.com/150" alt="YouTube">
</a>

</body>
</html>
